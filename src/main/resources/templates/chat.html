<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">초록 고객지원 챗봇</title>
    <style>
        :root {
            --bg: #eef3ef;
            --panel: #fbfdfb;
            --panel-strong: #14352b;
            --line: #d8e2dc;
            --text: #15251f;
            --muted: #62736b;
            --bot: #ffffff;
            --user: #1f8a5f;
            --user-dark: #176649;
            --accent: #f5b24d;
            --danger: #b53c31;
            --shadow: 0 18px 55px rgba(29, 55, 44, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                linear-gradient(120deg, rgba(245, 178, 77, 0.2), transparent 34%),
                linear-gradient(150deg, transparent 42%, rgba(31, 138, 95, 0.16)),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            display: grid;
            grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
            gap: 18px;
            width: min(1180px, calc(100% - 32px));
            min-height: min(820px, calc(100vh - 32px));
            margin: 16px auto;
        }

        .sidebar,
        .chat {
            border: 1px solid rgba(216, 226, 220, 0.9);
            background: rgba(251, 253, 251, 0.92);
            box-shadow: var(--shadow);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 24px;
            padding: 22px;
            border-radius: 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 26px;
        }

        .brand__mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border-radius: 8px;
            background: var(--panel-strong);
            color: #ffffff;
            font-weight: 800;
        }

        .brand__title {
            margin: 0;
            font-size: 19px;
            line-height: 1.25;
        }

        .new-session {
            display: inline-flex;
            width: 100%;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            background: var(--panel-strong);
            color: #ffffff;
            font-weight: 700;
        }

        .new-session:hover {
            background: #0f2a22;
        }

        .new-session-note {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .prompt-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .prompt-bar {
            padding: 12px 16px 0;
            background: #ffffff;
        }

        .prompt-bar[hidden] {
            display: none;
        }

        .prompt {
            min-height: 38px;
            padding: 9px 15px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #ffffff;
            color: var(--text);
            text-align: center;
            white-space: nowrap;
        }

        .prompt:hover {
            border-color: rgba(31, 138, 95, 0.45);
            background: #f5faf7;
        }

        .chat {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto auto;
            overflow: hidden;
            border-radius: 8px;
        }

        .chat__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.9);
        }

        .chat__title {
            margin: 0;
            font-size: 18px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 5px;
            color: var(--muted);
            font-size: 13px;
        }

        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #21a36d;
        }

        .new-session--mobile {
            display: none;
            width: auto;
            padding: 0 14px;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            padding: 22px 20px;
            background:
                linear-gradient(rgba(251, 253, 251, 0.78), rgba(251, 253, 251, 0.78)),
                repeating-linear-gradient(0deg, transparent 0 23px, rgba(20, 53, 43, 0.04) 24px);
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            max-width: min(76%, 720px);
            flex-direction: column;
            gap: 5px;
        }

        .message--bot {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message--user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .bubble {
            padding: 13px 15px;
            border-radius: 8px;
            box-shadow: 0 6px 22px rgba(26, 47, 39, 0.08);
        }

        .message--bot .bubble {
            border: 1px solid var(--line);
            background: var(--bot);
        }

        .message--user .bubble {
            background: var(--user);
            color: #ffffff;
        }

        .bubble__text {
            margin: 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.58;
            font-size: 15px;
        }

        .message__time {
            color: var(--muted);
            font-size: 12px;
        }

        .message--user .message__time {
            color: #7c8d85;
        }

        .typing {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            min-width: 52px;
            min-height: 24px;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #8ba199;
            animation: typing 1s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.12s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.24s;
        }

        @keyframes typing {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.45;
            }
            40% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        .composer {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            padding: 16px;
            background: #ffffff;
        }

        .composer__input {
            width: 100%;
            max-height: 160px;
            min-height: 46px;
            resize: none;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px 13px;
            color: var(--text);
            outline: none;
            line-height: 1.45;
        }

        .composer__input:focus {
            border-color: rgba(31, 138, 95, 0.7);
            box-shadow: 0 0 0 3px rgba(31, 138, 95, 0.12);
        }

        .send {
            min-width: 82px;
            min-height: 46px;
            border: 0;
            border-radius: 8px;
            background: var(--user);
            color: #ffffff;
            font-weight: 800;
        }

        .send:hover {
            background: var(--user-dark);
        }

        .send:disabled,
        .new-session:disabled,
        .prompt:disabled {
            cursor: not-allowed;
            opacity: 0.58;
        }

        .error .bubble {
            border-color: rgba(181, 60, 49, 0.35);
            color: var(--danger);
        }

        @media (max-width: 820px) {
            .app {
                grid-template-columns: 1fr;
                width: 100%;
                min-height: 100vh;
                margin: 0;
            }

            .sidebar {
                display: none;
            }

            .chat {
                min-height: 100vh;
                border: 0;
                border-radius: 0;
            }

            .new-session--mobile {
                display: inline-flex;
            }

            .message {
                max-width: 88%;
            }

            .composer {
                grid-template-columns: 1fr;
                padding-top: 12px;
            }

            .send {
                width: 100%;
            }

            .prompt-bar {
                padding: 10px 12px 0;
            }

            .prompt-list {
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-bottom: 2px;
            }

            .prompt {
                flex: 0 0 auto;
            }
        }
    </style>
</head>
<body>
<main class="app">
    <aside class="sidebar" aria-label="챗봇 메뉴">
        <div>
            <div class="brand">
                <div class="brand__mark">초</div>
                <div>
                    <h1 class="brand__title" th:text="${pageTitle}">초록 고객지원 챗봇</h1>
                </div>
            </div>
            <button class="new-session" type="button" data-new-session>새 대화 시작</button>
            <p class="new-session-note">이전 대화 내용은 기억되지 않습니다.</p>
        </div>
    </aside>

    <section class="chat" aria-label="챗봇 대화">
        <header class="chat__header">
            <div>
                <h2 class="chat__title">상담</h2>
                <div class="status" id="status">응답 대기 중</div>
            </div>
            <button class="new-session new-session--mobile" type="button" data-new-session>새 대화 시작</button>
        </header>

        <div class="messages" id="messages" th:data-initial-message="${initialMessage}">
            <article class="message message--bot">
                <div class="bubble">
                    <p class="bubble__text" th:text="${initialMessage}">
                        안녕하세요. 초록 고객지원 챗봇입니다.
                    </p>
                </div>
                <span class="message__time">지금</span>
            </article>
        </div>

        <div class="prompt-bar" id="quick-prompts">
            <div class="prompt-list" aria-label="빠른 질문">
                <button class="prompt" type="button" th:each="prompt : ${quickPrompts}" th:text="${prompt}" th:data-prompt="${prompt}">
                    배송은 보통 얼마나 걸리나요?
                </button>
            </div>
        </div>

        <form class="composer" id="chat-form">
            <textarea class="composer__input" id="question" name="question" rows="1" placeholder="메시지를 입력하세요" autocomplete="off" required></textarea>
            <button class="send" id="send-button" type="submit">전송</button>
        </form>
    </section>
</main>

<script th:inline="javascript">
    const chatEndpoint = /*[[@{/api/chat}]]*/ "/api/chat";
    const conversationEndpoint = /*[[@{/api/chat/conversation}]]*/ "/api/chat/conversation";

    const messages = document.querySelector("#messages");
    const form = document.querySelector("#chat-form");
    const question = document.querySelector("#question");
    const sendButton = document.querySelector("#send-button");
    const status = document.querySelector("#status");
    const quickPrompts = document.querySelector("#quick-prompts");
    const initialMessage = messages.dataset.initialMessage;

    function now() {
        return new Intl.DateTimeFormat("ko-KR", {
            hour: "2-digit",
            minute: "2-digit"
        }).format(new Date());
    }

    function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
    }

    function setBusy(isBusy) {
        sendButton.disabled = isBusy;
        question.disabled = isBusy;
        document.querySelectorAll("[data-new-session], .prompt").forEach((button) => {
            button.disabled = isBusy;
        });
        status.textContent = isBusy ? "답변 작성 중" : "응답 대기 중";
    }

    function appendMessage(role, text, options = {}) {
        const article = document.createElement("article");
        article.className = `message message--${role}`;
        if (options.error) {
            article.classList.add("error");
        }

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        const body = document.createElement("p");
        body.className = "bubble__text";
        body.textContent = text;

        const time = document.createElement("span");
        time.className = "message__time";
        time.textContent = now();

        bubble.append(body);
        article.append(bubble, time);
        messages.append(article);
        scrollToBottom();
        return article;
    }

    function showQuickPrompts(shouldShow) {
        quickPrompts.hidden = !shouldShow;
    }

    function appendTyping() {
        const article = document.createElement("article");
        article.className = "message message--bot";
        article.innerHTML = `
            <div class="bubble">
                <div class="typing" aria-label="답변 작성 중">
                    <span></span><span></span><span></span>
                </div>
            </div>
        `;
        messages.append(article);
        scrollToBottom();
        return article;
    }

    function resetMessages() {
        messages.replaceChildren();
        appendMessage("bot", initialMessage);
        showQuickPrompts(true);
    }

    function autoresize() {
        question.style.height = "auto";
        question.style.height = `${question.scrollHeight}px`;
    }

    async function sendQuestion(text) {
        const trimmed = text.trim();
        if (!trimmed) {
            return;
        }

        showQuickPrompts(false);
        appendMessage("user", trimmed);
        question.value = "";
        autoresize();
        setBusy(true);
        const typing = appendTyping();

        try {
            const response = await fetch(chatEndpoint, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({question: trimmed})
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            typing.remove();
            appendMessage("bot", data.answer || "답변을 가져오지 못했습니다.");
        } catch (error) {
            typing.remove();
            appendMessage("bot", "요청 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.", {error: true});
        } finally {
            setBusy(false);
            question.focus();
        }
    }

    async function startNewSession() {
        setBusy(true);
        try {
            const response = await fetch(conversationEndpoint, {
                method: "POST",
                credentials: "same-origin"
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            resetMessages();
            question.value = "";
            autoresize();
        } catch (error) {
            appendMessage("bot", "새 대화를 시작하지 못했습니다. 다시 시도해주세요.", {error: true});
        } finally {
            setBusy(false);
            question.focus();
        }
    }

    form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendQuestion(question.value);
    });

    question.addEventListener("input", autoresize);
    question.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
        }
    });

    document.querySelectorAll("[data-new-session]").forEach((button) => {
        button.addEventListener("click", startNewSession);
    });

    quickPrompts.addEventListener("click", (event) => {
        const promptButton = event.target.closest(".prompt");
        if (promptButton) {
            sendQuestion(promptButton.dataset.prompt || promptButton.textContent);
        }
    });

    autoresize();
    scrollToBottom();
</script>
</body>
</html>
