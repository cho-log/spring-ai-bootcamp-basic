spring:
  application:
    name: spring-ai-bootcamp-basic
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-nano
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small

app:
  rag:
    top-k: 7
    faq-split-regex: "(?m)^### "
    policy-split-regex: "(?m)^## "
