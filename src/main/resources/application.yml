spring:
  application:
    name: spring-ai-bootcamp-basic
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-nano
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small

app:
  chat:
    system-prompt: classpath:prompts/faq-system.st
